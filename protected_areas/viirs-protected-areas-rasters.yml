name: VIIRS protected areas raster maps

on:
  workflow_dispatch:
    inputs:
      range_mode:
        description: "single = један период; all_years = све године; months_range = опсег месеци"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - all_years
          - months_range
      period_kind:
        description: "За single: month или year"
        required: true
        default: "month"
        type: choice
        options:
          - month
          - year
      period:
        description: "Период за single: YYYY-MM, YYYY или auto за најновији месец"
        required: false
        default: "auto"
      start_year:
        description: "За all_years: почетна година"
        required: false
        default: "2014"
      start_month:
        description: "За months_range: почетни месец YYYY-MM"
        required: false
        default: "2026-01"
      end_month:
        description: "За months_range: крајњи месец YYYY-MM или auto"
        required: false
        default: "auto"
      area:
        description: "pa_id подручја, нпр. rajac, или all за сва подручја"
        required: true
        default: "rajac"
      style_mode:
        description: "heat_surface = права топлотна површ без видљивих квадрата, surface = прелазна површ, heatmap = мекши приказ, smooth = глатка карта, raw = изворни пиксели, all = све"
        required: true
        default: "heat_surface"
        type: choice
        options:
          - heat_surface
          - surface
          - heatmap
          - smooth
          - raw
          - both
          - all
      max_images:
        description: "Заштитни лимит броја PNG слика. За сва подручја и више периода ставити довољно висок број."
        required: false
        default: "60"
      overwrite:
        description: "Препиши постојеће PNG карте"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: viirs-protected-areas-raster-maps
  cancel-in-progress: false

jobs:
  viirs-rasters:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT_ID: deft-epigram-414409
      EE_SERVICE_ACCOUNT: rajac-light-monitor@deft-epigram-414409.iam.gserviceaccount.com
      EE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
      RANGE_MODE: ${{ github.event.inputs.range_mode || 'single' }}
      PERIOD_KIND: ${{ github.event.inputs.period_kind || 'month' }}
      PERIOD: ${{ github.event.inputs.period || 'auto' }}
      START_YEAR: ${{ github.event.inputs.start_year || '2014' }}
      START_MONTH: ${{ github.event.inputs.start_month || '2026-01' }}
      END_MONTH: ${{ github.event.inputs.end_month || 'auto' }}
      AREA: ${{ github.event.inputs.area || 'rajac' }}
      STYLE_MODE: ${{ github.event.inputs.style_mode || 'heat_surface' }}
      MAX_IMAGES: ${{ github.event.inputs.max_images || '120' }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-protected-areas.txt
          pip install requests

      - name: Generate VIIRS PNG raster maps
        run: |
          EXTRA=""
          if [ "$OVERWRITE" = "true" ]; then EXTRA="--overwrite"; fi
          python protected_areas/protected_areas_raster_exporter.py \
            --range-mode "$RANGE_MODE" \
            --period-kind "$PERIOD_KIND" \
            --period "$PERIOD" \
            --start-year "$START_YEAR" \
            --start-month "$START_MONTH" \
            --end-month "$END_MONTH" \
            --area "$AREA" \
            --style-mode "$STYLE_MODE" \
            --max-images "$MAX_IMAGES" \
            --areas-geojson protected_areas/zasticena_podrucja_srbije_gee.geojson \
            --results-dir public/results/protected-areas/rasters \
            --project "$EE_PROJECT_ID" \
            --service-account "$EE_SERVICE_ACCOUNT" \
            --key-json-env EE_SERVICE_ACCOUNT_KEY_JSON \
            --ee-deadline 300000 \
            --dimensions 1400 \
            --dimensions-smooth 2200 \
            --dimensions-heatmap 2400 \
            --dimensions-surface 1600 \
            --dimensions-heat-surface 2200 \
            --smooth-method bicubic \
            --smooth-radius 250 \
            --smooth-sigma 120 \
            --smooth-scale 120 \
            --heat-resample bicubic \
            --heat-radius 260 \
            --heat-sigma 110 \
            --heat-scale 30 \
            --heat-gain 1.0 \
            --surface-resample bicubic \
            --surface-radius 80 \
            --surface-sigma 0 \
            --surface-scale 120 \
            --surface-detail-weight 0.70 \
            --surface-gain 1.0 \
            --heat-surface-resample bicubic \
            --heat-surface-radius 700 \
            --heat-surface-sigma 250 \
            --heat-surface-scale 0 \
            --heat-surface-detail-weight 0.12 \
            --heat-surface-gain 1.0 \
            --heat-surface-min-weight 0.01 \
            --heat-surface-epsilon 0.0001 \
            --vis-min 0 \
            --vis-max 3 \
            --outline-width 2 \
            $EXTRA

      - name: Commit PNG raster maps
        run: |
          git config user.name "rajac-light-monitor"
          git config user.email "actions@github.com"
          git add public/results/protected-areas/rasters protected_areas/protected_areas_raster_exporter.py .github/workflows/viirs-protected-areas-rasters.yml README-VIIRS-RASTER-MAPS.md UPUTSTVO-GITHUB-V2.txt
          if git diff --cached --quiet; then
            echo "Нема нових PNG карата за упис."
          else
            git commit -m "Update VIIRS protected area raster maps"
            git push
          fi
