name: NASA Black Marble VNP46A2 — Rajac monthly maps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "latest = последњи завршен месец; range = опсег; single = један период"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - range
          - single
      start:
        description: "Почетни месец за range, YYYY-MM"
        required: false
        default: "2026-01"
      end:
        description: "Крајњи месец за range, YYYY-MM или auto"
        required: false
        default: "auto"
      period_kind:
        description: "За single: month или year"
        required: false
        default: "month"
        type: choice
        options:
          - month
          - year
      period:
        description: "За single: YYYY-MM, YYYY или auto"
        required: false
        default: "auto"
      area:
        description: "all за сва подручја или rajac само за Рајац"
        required: true
        default: "all"
      pixels:
        description: "Детаљни pixel JSON: all, rajac или none"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - rajac
          - none
      yearly:
        description: "Направи и годишњи композит за године у опсегу"
        required: false
        default: true
        type: boolean
      overwrite:
        description: "Препиши постојеће периоде"
        required: false
        default: true
        type: boolean
  schedule:
    # Провера новог завршеног месеца пет пута месечно.
    - cron: "20 5 5,10,15,20,25 * *"

permissions:
  contents: write

concurrency:
  group: black-marble-vnp46a2-monthly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID || 'deft-epigram-414409' }}
      EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT || 'rajac-light-monitor@deft-epigram-414409.iam.gserviceaccount.com' }}
      EE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_KEY_JSON || secrets.GEE_SERVICE_ACCOUNT_JSON }}
      MODE: ${{ github.event.inputs.mode || 'latest' }}
      START_MONTH: ${{ github.event.inputs.start || '2026-01' }}
      END_MONTH: ${{ github.event.inputs.end || 'auto' }}
      PERIOD_KIND: ${{ github.event.inputs.period_kind || 'month' }}
      PERIOD: ${{ github.event.inputs.period || 'auto' }}
      AREA: ${{ github.event.inputs.area || 'all' }}
      PIXELS: ${{ github.event.inputs.pixels || 'all' }}
      YEARLY: ${{ github.event.inputs.yearly || 'false' }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-black-marble.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-black-marble.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate configuration
        run: |
          test -n "$EE_PROJECT_ID" || (echo "Недостаје EE_PROJECT_ID" && exit 1)
          test -n "$EE_SERVICE_ACCOUNT" || (echo "Недостаје EE_SERVICE_ACCOUNT" && exit 1)
          test -n "$EE_SERVICE_ACCOUNT_KEY_JSON" || (echo "Недостаје EE_SERVICE_ACCOUNT_KEY_JSON или GEE_SERVICE_ACCOUNT_JSON" && exit 1)
          test -f protected_areas/zasticena_podrucja_srbije_gee.geojson
          python -m py_compile black_marble/build_black_marble.py

      - name: Build Black Marble JSON products
        run: |
          EXTRA=""
          if [ "$YEARLY" = "true" ]; then EXTRA="$EXTRA --yearly"; fi
          if [ "$OVERWRITE" = "true" ]; then EXTRA="$EXTRA --overwrite"; fi

          python black_marble/build_black_marble.py \
            --mode "$MODE" \
            --start "$START_MONTH" \
            --end "$END_MONTH" \
            --period-kind "$PERIOD_KIND" \
            --period "$PERIOD" \
            --area "$AREA" \
            --pixels "$PIXELS" \
            --areas-geojson protected_areas/zasticena_podrucja_srbije_gee.geojson \
            --root-results-dir public/results \
            --protected-results-dir public/results/protected-areas \
            --project "$EE_PROJECT_ID" \
            --service-account "$EE_SERVICE_ACCOUNT" \
            --key-json-env EE_SERVICE_ACCOUNT_KEY_JSON \
            --scale 500 \
            --tile-scale 4 \
            --min-source-days 15 \
            --min-observations 3 \
            --min-months-year 3 \
            --min-cloud-mask-quality 2 \
            --max-cloud-detection 1 \
            $EXTRA

      - name: Rebuild existing summary products
        run: |
          if [ -f stats_processor.py ]; then
            python stats_processor.py
          else
            echo "stats_processor.py није присутан — прескачем додатне резимее."
          fi

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [Path('public/results/index.json'), Path('public/results/protected-areas/index.json')]
          for path in roots:
              data = json.loads(path.read_text(encoding='utf-8'))
              if not data:
                  raise SystemExit(f'Празан JSON: {path}')
              print('OK', path)
          PY

      - name: Commit generated products
        run: |
          git config user.name "rajac-light-monitor"
          git config user.email "actions@github.com"
          git add \
            public/results \
            black_marble/build_black_marble.py \
            requirements-black-marble.txt \
            protected_areas/zasticena_podrucja_srbije_gee.geojson \
            .github/workflows/black-marble-vnp46a2.yml \
            .github/workflows/build-rajac-light.yml \
            .github/workflows/viirs-protected-areas.yml \
            .github/workflows/viirs-protected-areas-pixels.yml \
            .github/workflows/viirs-protected-areas-rasters.yml
          for extra_path in public/statistics public/sites public/catalog.json; do
            if [ -e "$extra_path" ]; then git add "$extra_path"; fi
          done
          if git diff --cached --quiet; then
            echo "Нема новог завршеног месеца или измена за упис."
          else
            git commit -m "Update NASA Black Marble VNP46A2 monthly results"
            git push
          fi
