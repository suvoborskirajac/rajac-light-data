name: VIIRS protected areas pixel JSON

on:
  workflow_dispatch:
    inputs:
      range_mode:
        description: "single = један период; all_years = све године; months_range = опсег месеци"
        required: true
        default: "single"
        type: choice
        options:
          - single
          - all_years
          - months_range
      period_kind:
        description: "За single: month или year"
        required: true
        default: "month"
        type: choice
        options:
          - month
          - year
      period:
        description: "Период за single: YYYY-MM, YYYY или auto за најновији месец"
        required: false
        default: "2026-04"
      start_year:
        description: "За all_years: почетна година"
        required: false
        default: "2014"
      start_month:
        description: "За months_range: почетни месец YYYY-MM"
        required: false
        default: "2026-01"
      end_month:
        description: "За months_range: крајњи месец YYYY-MM или auto"
        required: false
        default: "auto"
      area:
        description: "pa_id подручја, нпр. rajac, или all за сва подручја"
        required: true
        default: "rajac"
      max_areas:
        description: "Заштитни лимит броја подручја. За all ставити 60."
        required: false
        default: "60"
      overwrite:
        description: "Препиши постојеће pixel JSON фајлове"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: viirs-protected-areas-pixel-json
  cancel-in-progress: false

jobs:
  viirs-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EE_PROJECT_ID: deft-epigram-414409
      EE_SERVICE_ACCOUNT: rajac-light-monitor@deft-epigram-414409.iam.gserviceaccount.com
      EE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
      RANGE_MODE: ${{ github.event.inputs.range_mode || 'single' }}
      PERIOD_KIND: ${{ github.event.inputs.period_kind || 'month' }}
      PERIOD: ${{ github.event.inputs.period || '2026-04' }}
      START_YEAR: ${{ github.event.inputs.start_year || '2014' }}
      START_MONTH: ${{ github.event.inputs.start_month || '2026-01' }}
      END_MONTH: ${{ github.event.inputs.end_month || 'auto' }}
      AREA: ${{ github.event.inputs.area || 'rajac' }}
      MAX_AREAS: ${{ github.event.inputs.max_areas || '60' }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-protected-areas.txt

      - name: Generate pixel JSON files
        run: |
          EXTRA=""
          if [ "$OVERWRITE" = "true" ]; then EXTRA="--overwrite"; fi
          python protected_areas/protected_areas_pixels_exporter.py \
            --range-mode "$RANGE_MODE" \
            --period-kind "$PERIOD_KIND" \
            --period "$PERIOD" \
            --start-year "$START_YEAR" \
            --start-month "$START_MONTH" \
            --end-month "$END_MONTH" \
            --area "$AREA" \
            --max-areas "$MAX_AREAS" \
            --max-pixels-per-area 5000 \
            --areas-geojson protected_areas/zasticena_podrucja_srbije_gee.geojson \
            --results-dir public/results/protected-areas \
            --project "$EE_PROJECT_ID" \
            --service-account "$EE_SERVICE_ACCOUNT" \
            --key-json-env EE_SERVICE_ACCOUNT_KEY_JSON \
            --ee-deadline 300000 \
            --scale 463.83 \
            --edge-buffer-meters 260 \
            --tile-scale 4 \
            --min-cf-cvg 1 \
            --min-months-year 3 \
            $EXTRA

      - name: Commit pixel JSON files
        run: |
          git config user.name "rajac-light-monitor"
          git config user.email "actions@github.com"
          git add public/results/protected-areas/pixels protected_areas/protected_areas_pixels_exporter.py .github/workflows/viirs-protected-areas-pixels.yml
          if git diff --cached --quiet; then
            echo "Нема нових pixel JSON фајлова за упис."
          else
            git commit -m "Update VIIRS protected area pixel JSON"
            git push
          fi
