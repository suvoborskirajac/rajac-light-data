name: NASA Black Marble VNP46A2 — Serbia national grid

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline = 2025 annual + latest month; latest = latest month; single = chosen period"
        required: true
        default: "baseline"
        type: choice
        options: [baseline, latest, single]
      period_kind:
        description: "For single: month or year"
        required: false
        default: "year"
        type: choice
        options: [month, year]
      period:
        description: "For single: YYYY-MM, YYYY or auto"
        required: false
        default: "auto"
      baseline_year:
        description: "Stable annual baseline"
        required: false
        default: "2025"
      overwrite:
        description: "Overwrite existing national period"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "40 6 6,12,18,24 * *"

permissions:
  contents: write

concurrency:
  group: black-marble-serbia-national
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID || 'deft-epigram-414409' }}
      EE_SERVICE_ACCOUNT: ${{ secrets.EE_SERVICE_ACCOUNT || 'rajac-light-monitor@deft-epigram-414409.iam.gserviceaccount.com' }}
      EE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_KEY_JSON || secrets.GEE_SERVICE_ACCOUNT_JSON }}
      MODE: ${{ github.event.inputs.mode || 'latest' }}
      PERIOD_KIND: ${{ github.event.inputs.period_kind || 'year' }}
      PERIOD: ${{ github.event.inputs.period || 'auto' }}
      BASELINE_YEAR: ${{ github.event.inputs.baseline_year || '2025' }}
      OVERWRITE: ${{ github.event.inputs.overwrite || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-black-marble.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-black-marble.txt

      - name: Validate
        run: |
          test -n "$EE_PROJECT_ID"
          test -n "$EE_SERVICE_ACCOUNT"
          test -n "$EE_SERVICE_ACCOUNT_KEY_JSON"
          test -f public/boundaries/granica_srbije.geojson
          python -m py_compile black_marble/build_black_marble.py black_marble/build_serbia_viirs.py

      - name: Build Serbia national products
        shell: bash
        run: |
          EXTRA=""
          if [ "$OVERWRITE" = "true" ]; then EXTRA="--overwrite"; fi
          if [ "$MODE" = "baseline" ]; then
            python black_marble/build_serbia_viirs.py --period-kind year --period "$BASELINE_YEAR" $EXTRA
            python black_marble/build_serbia_viirs.py --period-kind month --period auto $EXTRA
          elif [ "$MODE" = "single" ]; then
            python black_marble/build_serbia_viirs.py --period-kind "$PERIOD_KIND" --period "$PERIOD" $EXTRA
          else
            python black_marble/build_serbia_viirs.py --period-kind month --period auto $EXTRA
          fi

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/results/serbia/index.json')
          data = json.loads(root.read_text(encoding='utf-8'))
          assert data.get('ok') and data.get('records')
          for record in data['records']:
              path = Path('public/results/serbia') / record['file']
              obj = json.loads(path.read_text(encoding='utf-8'))
              assert obj.get('ok') and obj.get('tiles')
          print('OK', root, 'records=', len(data['records']))
          PY

      - name: Commit national products
        run: |
          git config user.name "rajac-light-monitor"
          git config user.email "actions@github.com"
          git add \
            black_marble/build_serbia_viirs.py \
            public/boundaries/granica_srbije.geojson \
            public/results/serbia \
            .github/workflows/viirs-serbia.yml \
            README-VIIRS-SERBIA.md
          if git diff --cached --quiet; then
            echo "Нема нових измена."
          else
            git commit -m "Update Serbia-wide VIIRS Black Marble grid"
            git push
          fi
