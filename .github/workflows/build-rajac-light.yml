name: Build Rajac light pollution data

on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Number of latest complete months to process'
        required: false
        default: '12'
  schedule:
    - cron: '0 3 5 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Earth Engine secret
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os

          secret = os.environ.get("GEE_SERVICE_ACCOUNT_JSON", "").strip()

          if not secret:
              raise SystemExit("ERROR: GEE_SERVICE_ACCOUNT_JSON is empty or missing.")

          try:
              data = json.loads(secret)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"ERROR: GEE_SERVICE_ACCOUNT_JSON is not valid JSON: {exc}")

          required = ["type", "project_id", "private_key", "client_email", "token_uri"]
          missing = [key for key in required if not data.get(key)]

          if missing:
              raise SystemExit(f"ERROR: Missing fields in service account JSON: {', '.join(missing)}")

          print("Secret JSON is valid.")
          print("Project ID:", data.get("project_id"))
          print("Client email:", data.get("client_email"))
          PY

      - name: Build VIIRS monthly results
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          MONTHS_BACK: ${{ github.event.inputs.months || '12' }}
        run: python processor.py --months "$MONTHS_BACK" --dataset monthly-vcmsl

      - name: Show generated results
        if: always()
        run: |
          echo "Repository tree after processing:"
          find public -maxdepth 3 -type f -print | sort || true
          echo "Results directory:"
          ls -lah public/results || true

      - name: Commit generated JSON results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/results
          if git diff --staged --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update Rajac VIIRS light pollution JSON results"
            git push
          fi
