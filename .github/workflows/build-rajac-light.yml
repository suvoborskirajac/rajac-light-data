name: Build multi-area light pollution data

on:
  workflow_dispatch:
    inputs:
      monthly_from:
        description: 'Earliest year for monthly maps'
        required: false
        default: '2024'
  schedule:
    - cron: '0 3 5 * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build VIIRS monthly archive from 2024 and yearly results for all areas
        env:
          GEE_PROJECT: deft-epigram-414409
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          MONTHLY_FROM: ${{ github.event.inputs.monthly_from || '2024' }}
        run: python processor.py --dataset monthly-vcmsl --monthly-from "$MONTHLY_FROM" --yearly --yearly-from 2013

      - name: Build statistical summaries, trends and observatory buffers
        run: python stats_processor.py

      - name: Show generated results
        if: always()
        run: |
          echo "Repository tree after processing:"
          find public -maxdepth 6 -type f -print | sort || true

      - name: Commit generated JSON results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/results public/sites public/catalog.json public/statistics stats_processor.py
          if git diff --staged --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update multi-area VIIRS archive and statistics"
            git push
          fi
